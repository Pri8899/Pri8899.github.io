<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 270" width="200" height="270" role="img" aria-label="Toph profile">
  <defs>
    <!-- Card Clip Path -->
    <clipPath id="card-clip-tp">
      <rect width="200" height="270" rx="18" />
    </clipPath>

    <!-- Neon Glow Filter -->
    <filter id="filter-glow-tp" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="200" height="270" rx="18" fill="#0d1117" />
  <rect width="200" height="270" rx="18" fill="#161b22" fill-opacity="0.5" />

  <!-- Outer Neon Glow Border with Continuous Pulse Animation -->
  <rect x="1" y="1" width="198" height="268" rx="17" fill="none" stroke="#f43f5e" stroke-width="2" stroke-opacity="0.8" filter="url(#filter-glow-tp)">
    <animate attributeName="stroke-opacity" values="0.35; 0.95; 0.35" dur="2.4s" repeatCount="indefinite" />
    <animate attributeName="stroke-width" values="1.6; 2.6; 1.6" dur="2.4s" repeatCount="indefinite" />
  </rect>

  <!-- Top Curved Accent Bar with Continuous Sliding Laser Beam -->
  <g clip-path="url(#card-clip-tp)">
    <rect x="0" y="0" width="200" height="4.5" fill="#f43f5e" fill-opacity="0.45" />
    <!-- Sliding Neon Laser Shimmer Beam -->
    <rect y="0" width="80" height="4.5" fill="#ffffff" fill-opacity="0.95">
      <animate attributeName="x" values="-80; 200; -80" dur="2.8s" repeatCount="indefinite" />
    </rect>
    <rect y="0" width="80" height="4.5" fill="#f43f5e" fill-opacity="0.75">
      <animate attributeName="x" values="-80; 200; -80" dur="2.8s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Center Icon Frame with Animated Glowing Aura -->
  <circle cx="100" cy="62" r="34" fill="#f43f5e" fill-opacity="0.22">
    <animate attributeName="r" values="28; 38; 28" dur="2.6s" repeatCount="indefinite" />
    <animate attributeName="fill-opacity" values="0.15; 0.38; 0.15" dur="2.6s" repeatCount="indefinite" />
  </circle>
  <rect x="68" y="30" width="64" height="64" rx="18" fill="#f43f5e" fill-opacity="0.12" stroke="#f43f5e" stroke-opacity="0.45" stroke-width="1.4">
    <animate attributeName="stroke-opacity" values="0.3; 0.8; 0.3" dur="2.4s" repeatCount="indefinite" />
  </rect>
  <image x="81" y="42" width="38" height="40" href="data:image/png;base64," />

  <!-- Platform Name & Handle -->
  <text x="100" y="132" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18.5" font-weight="700" fill="#f0f6fc">Toph</text>
  <text x="100" y="153" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8b949e">@Pri8899</text>

  <!-- Divider -->
  <line x1="36" y1="173" x2="164" y2="173" stroke="#21262d" />

  <!-- Solved Count & Label -->
  <text x="100" y="209" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#f0f6fc">0</text>
  <text x="100" y="228" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#8b949e">SOLUTIONS</text>

  <!-- Bottom Badge with Pulse Animation -->
  <g transform="translate(100, 254)">
    <rect x="-56" y="-14" width="112" height="22" rx="11" fill="#f43f5e" fill-opacity="0.12" stroke="#f43f5e" stroke-opacity="0.35" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.2; 0.65; 0.2" dur="2.2s" repeatCount="indefinite" />
    </rect>
    <text text-anchor="middle" y="2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6e7681">
      View profile →
      
    </text>
  </g>
</svg>